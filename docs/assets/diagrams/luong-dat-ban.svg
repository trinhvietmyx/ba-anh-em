<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Luồng đặt bàn và xác minh cọc mẫu</title>
  <desc id="desc">Khách kiểm tra khung giờ, nhập liên hệ, kiểm tra lại và gửi yêu cầu. Lượt đặt chờ xác nhận, có thể chọn món trước. Sau khi báo đã chuyển, khách kiểm tra tiền cọc để xác nhận hoặc ghi nhận ngoại lệ.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path fill="#8e593f" d="M0 0 9 4.5 0 9z"/>
    </marker>
    <style>
      text { font-family: system-ui, 'Segoe UI', sans-serif; fill: #30251f }
      .section { fill: #78432f; font-size: 15px; font-weight: 700; letter-spacing: 1.5px }
      .name { font-size: 19px; font-weight: 700 }
      .detail { fill: #61544a; font-size: 15.5px }
      .arrow { fill: none; stroke: #8e593f; stroke-width: 2; marker-end: url(#arrow) }
      .node { fill: #fffefa; stroke: #d9c7b6 }
      .optional { fill: #fffefa; stroke: #a77c5f; stroke-dasharray: 5 4 }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="498" rx="24" fill="#fbf4e9" stroke="#decab7"/>
  <rect x="26" y="26" width="948" height="147" rx="17" fill="#f5e8d9"/>
  <rect x="26" y="195" width="948" height="279" rx="17" fill="#f5e8d9"/>
  <text class="section" x="47" y="55">GỬI YÊU CẦU</text>
  <text class="section" x="47" y="225">XỬ LÝ LƯỢT ĐẶT</text>

  <path class="arrow" d="M245 113h31"/>
  <path class="arrow" d="M479 113h31"/>
  <path class="arrow" d="M713 113h31"/>
  <path class="arrow" d="M850 147v34H39v101h7"/>
  <path class="arrow" d="M245 282h265"/>
  <path class="arrow" d="M713 282h31"/>
  <path class="arrow" d="M146 314v69h129" stroke-dasharray="5 4"/>
  <path class="arrow" d="M479 383h76v-65" stroke-dasharray="5 4"/>
  <path class="arrow" d="M850 313v23H705v19"/>
  <path class="arrow" d="M850 336h48v92H795"/>

  <rect class="node" x="47" y="78" width="198" height="69" rx="12"/>
  <text class="name" x="63" y="108">Kiểm tra chỗ</text>
  <text class="detail" x="63" y="132">Ngày, số khách, giờ</text>
  <rect class="node" x="281" y="78" width="198" height="69" rx="12"/>
  <text class="name" x="297" y="108">Điền liên hệ</text>
  <text class="detail" x="297" y="132">Tên và điện thoại mẫu</text>
  <rect class="node" x="515" y="78" width="198" height="69" rx="12"/>
  <text class="name" x="531" y="108">Kiểm tra lại</text>
  <text class="detail" x="531" y="132">Xem tóm tắt yêu cầu</text>
  <rect class="node" x="749" y="78" width="198" height="69" rx="12"/>
  <text class="name" x="765" y="108">Gửi yêu cầu</text>
  <text class="detail" x="765" y="132">Tạo mã đặt chỗ</text>

  <rect class="node" x="47" y="248" width="198" height="66" rx="12"/>
