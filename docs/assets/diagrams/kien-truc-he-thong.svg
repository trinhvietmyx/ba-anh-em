<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 0 1000 478" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc hiện tại của Nhà hàng Ba Anh Em</title>
  <desc id="desc">Trình duyệt dùng ứng dụng React với service mô phỏng. Vite proxy các lệnh API đến NestJS. NestJS kết nối PostgreSQL và nhà cung cấp OIDC khi có cấu hình.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path fill="#8e593f" d="M0 0 9 4.5 0 9z"/>
    </marker>
    <style>
      text { font-family: system-ui, 'Segoe UI', sans-serif; fill: #30251f }
      .section { fill: #78432f; font-size: 15px; font-weight: 700; letter-spacing: 1.5px }
      .name { font-size: 22px; font-weight: 700 }
      .detail { fill: #61544a; font-size: 17px }
      .arrow { fill: none; stroke: #8e593f; stroke-width: 2; marker-end: url(#arrow) }
      .node { fill: #fffefa; stroke: #d9c7b6 }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="476" rx="24" fill="#fbf4e9" stroke="#decab7"/>
  <rect x="28" y="31" width="442" height="416" rx="18" fill="#f5e8d9"/>
  <rect x="530" y="31" width="442" height="416" rx="18" fill="#f5e8d9"/>
  <text class="section" x="50" y="61">TRÌNH DUYỆT</text>
  <text class="section" x="552" y="61">MÁY CHỦ API</text>

  <path class="arrow" d="M424 147H573" stroke-dasharray="6 6"/>
  <path class="arrow" d="M249 211v44"/>
  <path class="arrow" d="M751 211v44"/>
  <path class="arrow" d="M806 211v22h93v147h-73"/>

  <rect class="node" x="74" y="86" width="350" height="125" rx="13"/>
  <text class="name" x="96" y="121">React · Vite</text>
  <text class="detail" x="96" y="153">Giao diện khách và vận hành</text>
  <text class="detail" x="96" y="181">React Router · TanStack Query</text>

  <rect class="node" x="74" y="260" width="350" height="93" rx="13"/>
  <text class="name" x="96" y="295">Dịch vụ mô phỏng</text>
  <text class="detail" x="96" y="325">Fixture và trạng thái trong bộ nhớ</text>
  <text class="detail" x="74" y="392">Vite proxy → <tspan font-family="monospace">/api/v1</tspan> khi chạy local</text>
  <text class="detail" x="74" y="421">Luồng nghiệp vụ UI dùng dữ liệu mẫu.</text>

  <rect class="node" x="576" y="86" width="350" height="125" rx="13"/>
  <text class="name" x="598" y="121">NestJS</text>
  <text class="detail" x="598" y="153">Health check · phiên khách và nhân sự</text>
  <text class="detail" x="598" y="181">Swagger · OpenAPI sinh từ mã nguồn</text>

  <rect class="node" x="576" y="260" width="246" height="67" rx="13"/>
  <text class="name" x="596" y="288">PostgreSQL 17</text>
  <text class="detail" x="596" y="313">Kysely · migrations</text>

  <rect class="node" x="576" y="346" width="246" height="67" rx="13"/>
  <text class="name" x="596" y="374">Nhà cung cấp OIDC</text>
