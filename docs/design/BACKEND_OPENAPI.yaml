      description: 'Mã lý do an toàn theo phạm vi quyền. Giá trị nghiệp vụ phụ thuộc chính sách đã duyệt.'
      anyOf:
        - type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]*$'
        - type: 'null'
    ReportsResponse:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - timeZone
        - asOf
        - metrics
        - byStatus
      properties:
        from:
          $ref: '#/components/schemas/Date'
        to:
          $ref: '#/components/schemas/Date'
        timeZone:
          type: string
          maxLength: 80
        asOf:
          $ref: '#/components/schemas/Instant'
        metrics:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - key
              - value
              - unit
            properties:
              key:
                type: string
                enum:
                  - reservations
                  - expected_guests
                  - no_show_count
                  - no_show_rate
                  - verified_deposit_count
                  - verified_deposit_vnd
              value:
                anyOf:
                  - type: number
                    minimum: 0
                    maximum: 9007199254740991
                  - type: 'null'
              unit:
                type: string
                enum:
                  - count
                  - vnd
                  - ratio
            allOf:
              - if:
                  properties:
                    key:
                      const: no_show_rate
                then:
                  properties:
                    unit:
                      const: ratio
                    value:
                      anyOf:
                        - type: number
                          minimum: 0
                          maximum: 1
                        - type: 'null'
                else:
                  properties:
                    value:
                      $ref: '#/components/schemas/MoneyVnd'
              - if:
                  properties:
                    key:
                      const: verified_deposit_vnd
                then:
                  properties:
                    unit:
                      const: vnd
                else:
                  properties:
                    unit:
                      enum:
                        - count
                        - ratio
              - if:
                  properties:
                    key:
                      enum:
                        - reservations
                        - expected_guests
                        - no_show_count
                        - verified_deposit_count
                then:
                  properties:
                    unit:
                      const: count
