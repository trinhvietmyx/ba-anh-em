      description: 'Server chọn namespace nguồn đã duyệt và kiểm bằng chứng, mã, tiền, hạn, giao dịch lặp và phiên bản. Với match, dùng thời điểm chuyển từ bằng chứng có thẩm quyền. Nếu chưa xác minh được thời điểm, trả 422 PAYMENT_TIME_REQUIRED. Với flag_exception, lưu lý do tự do và quan sát rời nếu có, server gán mã lý do và chưa công nhận là tiền thực nhận. Tiền trễ xử lý theo Q-03/Q-04/Q-06.'
      x-policy-questions:
        - Q-03
        - Q-04
        - Q-06
        - Q-08
        - Q-15
      x-permissions:
        - deposits.read
        - deposits.reconcile
      security:
        - StaffCookie: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/DepositId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/ReconciliationInput'
            example:
              decision: match
              expectedVersion: 2
              evidence:
                transactionId: TEST-TXN-01
                amountReceived: 200000
                transferredAt: '2026-12-04T12:00:00Z'
                transferContent: COC-DEMO-01
      responses:
        '201':
          description: 'Đã ghi kết quả và trả khoản cọc hiện hành theo quyền.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/OpsDeposit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/ops/reports':
    get:
      operationId: getOpsReports
      tags:
        - 'Báo cáo'
      summary: 'Đọc báo cáo theo khoảng ngày'
      description: 'Ngày bắt đầu và kết thúc tính theo múi giờ nhà hàng, gồm cả hai ngày. Quy ước tạm theo màn hình và BRS Q-10 ở tài liệu ánh xạ. null biểu diễn tỷ lệ chưa tính khi mẫu số bằng 0.'
      x-policy-questions:
        - Q-08
        - Q-10
        - Q-14
      x-permissions:
        - reports.read
      security:
        - StaffCookie: []
      parameters:
        - name: from
          in: query
          description: 'Ngày bắt đầu.'
          required: true
          schema:
            $ref: '#/components/schemas/Date'
        - name: to
          in: query
          description: 'Ngày kết thúc, không trước from.'
          required: true
          schema:
            $ref: '#/components/schemas/Date'
      responses:
        '200':
          description: 'Chỉ số và phân nhóm theo nguồn đặt.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ReportsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/chat/messages':
    post:
      operationId: replyToChatMessage
      tags:
        - Chatbot
      summary: 'Tư vấn món hoặc hỗ trợ nhập ý định đặt bàn'
      description: 'Chỉ tư vấn hoặc trả gợi ý cho UI, không ghi lượt. Server truy cập menu công bố, kiểm phần ngữ cảnh được phép gửi Groq và xác thực kết quả model. Khi đủ khung và số khách, có thể cấp chatContext ngắn hạn gắn với phiên để gửi tại bước xác nhận hiện có.'
      x-policy-questions:
        - Q-07
        - Q-09
        - Q-11
        - Q-14
      security:
        - GuestCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/ChatInput'
            example:
              message: 'Tối mai có bàn cho 4 người không?'
      responses:
        '200':
          description: 'Tin nhắn, gợi ý món và bước tiếp theo nếu có.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    GuestCookie:
      type: apiKey
      in: cookie
      name: __Host-bae_guest
      description: 'Cookie opaque HttpOnly cho phiên khách. Trình duyệt gửi cùng origin.'
    StaffCookie:
      type: apiKey
      in: cookie
      name: __Host-bae_staff
      description: 'Cookie opaque HttpOnly cho phiên nhân sự.'
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 'Token gắn phiên. Thao tác ghi cũng kiểm Origin.'
  parameters:
    MenuDishId:
      name: dishId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MenuItemReference'
      description: 'Mã món dùng chung với thực đơn công khai trong phạm vi nhà hàng.'
    ReservationId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ReservationReference'
      description: 'Mã lượt đã có trên route Frontend.'
    DepositId:
      name: depositId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: 'Định danh khoản cọc được server trả về.'
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: 'Origin của ứng dụng web. Backend đối chiếu chính xác với cấu hình.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 16
        pattern: '^[A-Za-z0-9._~-]+$'
      description: 'Giữ cùng khóa cho cùng một lần ghi và retry. Đổi ý định thì cấp khóa khác.'
    OperationResultKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
        minLength: 16
        pattern: '^[A-Za-z0-9._~-]+$'
      description: 'Chỉ dùng để kiểm kết quả lần ghi đối chiếu của nhân sự hiện tại khi mất phản hồi.'
    Limit:
      name: limit
      in: query
      description: 'Kích thước trang, giới hạn kỹ thuật đề xuất.'
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: 'Cursor opaque của cùng bộ lọc, thứ tự và phạm vi quyền.'
      required: false
      schema:
        type: string
        maxLength: 2048
        minLength: 1
  responses:
    AttemptUnavailable:
      description: 'Chưa có kết quả tạo lượt mà phiên được phép đọc.'
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            code: OUTCOME_NOT_AVAILABLE
            message: 'Chưa tìm thấy kết quả của lần đặt bàn này.'
            traceId: trace-example
    BadRequest:
      description: 'Định dạng request không hợp lệ.'
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            code: INVALID_REQUEST
            message: 'Kiểm tra dữ liệu gửi.'
            traceId: trace-example
    Unauthenticated:
      description: 'Thiếu phiên hoặc phiên đã hết hiệu lực.'
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            code: SESSION_REQUIRED
            message: 'Vui lòng tiếp tục với phiên hợp lệ.'
            traceId: trace-example
    Forbidden:
      description: 'Không có quyền thực hiện hoặc kiểm CSRF/Origin không đạt.'
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            code: FORBIDDEN
            message: 'Bạn không có quyền thực hiện yêu cầu này.'
            traceId: trace-example
    NotFound:
      description: 'Tài nguyên không khả dụng trong phạm vi được phép đọc.'
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            code: RESOURCE_NOT_FOUND
            message: 'Không tìm thấy dữ liệu.'
            traceId: trace-example
    Conflict:
      description: 'Xung đột trạng thái, phiên bản, bàn, khóa hoặc giao dịch.'
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            code: STATE_CONFLICT
            message: 'Dữ liệu đã thay đổi. Vui lòng kiểm tra lại.'
            traceId: trace-example
    Unprocessable:
      description: 'Đầu vào đúng dạng nhưng vi phạm quy tắc nghiệp vụ.'
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            code: RULE_VIOLATION
            message: 'Yêu cầu chưa đáp ứng điều kiện.'
            traceId: trace-example
    RateLimit:
      description: 'Vượt giới hạn tần suất.'
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
        Retry-After:
          description: 'Số giây nên chờ khi server có thể xác định.'
          schema:
            type: integer
            minimum: 0
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            code: RATE_LIMITED
            message: 'Thử lại sau.'
            traceId: trace-example
            retryable: true
    Unavailable:
      description: 'Hạ tầng hoặc tích hợp tạm thời gián đoạn.'
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
        Retry-After:
          description: 'Số giây nên chờ khi server có thể xác định.'
          schema:
            type: integer
            minimum: 0
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            code: DEPENDENCY_UNAVAILABLE
            message: 'Dịch vụ tạm thời gián đoạn.'
            traceId: trace-example
            retryable: true
    InternalError:
      description: 'Lỗi nội bộ. Dùng traceId để hỗ trợ, không đưa chi tiết hạ tầng vào phản hồi.'
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            code: INTERNAL_ERROR
            message: 'Đã xảy ra lỗi. Vui lòng kiểm tra lại.'
            traceId: trace-example
            retryable: false
  schemas:
    Date:
      type: string
      format: date
      examples:
        - '2026-12-05'
    Time:
      type: string
      pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
      examples:
        - '18:00'
    Instant:
      type: string
      format: date-time
    Uuid:
      type: string
      format: uuid
    ReservationReference:
      type: string
      maxLength: 64
      minLength: 1
      pattern: '^[A-Z0-9][A-Z0-9-]*$'
      examples:
        - BAE-1044
      description: 'Mã tham chiếu hiển thị của lượt. Phạm vi của nhà hàng lấy từ cấu hình server.'
    Version:
      type: integer
      minimum: 1
      maximum: 2147483647
    MoneyVnd:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    BookingStatus:
      type: string
      enum:
        - pending
        - confirmed
        - arrived
        - completed
        - no-show
        - cancelled
    DepositStatus:
      type: string
      enum:
        - pending
        - review
        - verified
        - exception
        - expired
    ServiceAction:
      type: string
      enum:
        - confirm
        - mark_arrived
        - complete
        - mark_no_show
    Permission:
      type: string
      enum:
        - menu.read
        - menu.write
        - reservations.read
        - reservations.read_contact
        - reservations.read_audit
        - reservations.write_events
        - floorplan.read
        - floorplan.allocate
        - kitchen.read
        - deposits.read
        - deposits.reconcile
        - reports.read
    PageCursor:
      anyOf:
        - type: string
          maxLength: 2048
          minLength: 1
        - type: 'null'
    ApiProblem:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
          maxLength: 500
          minLength: 1
        fields:
          type: object
          additionalProperties:
            anyOf:
              - type: string
                maxLength: 300
              - type: array
                items:
                  type: string
                  maxLength: 300
        traceId:
          type: string
          maxLength: 128
          minLength: 1
        retryable:
          type: boolean
    GuestSession:
      type: object
      additionalProperties: false
      required:
        - csrfToken
        - expiresAt
      properties:
        csrfToken:
          type: string
          maxLength: 256
          minLength: 16
        expiresAt:
          $ref: '#/components/schemas/Instant'
    StaffSession:
      type: object
      additionalProperties: false
      required:
        - displayName
        - displayRole
        - permissions
        - csrfToken
        - expiresAt
      properties:
        displayName:
          type: string
          maxLength: 120
          minLength: 1
        displayRole:
          type: string
          enum:
            - employee
            - admin
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          uniqueItems: true
        csrfToken:
          type: string
          maxLength: 256
          minLength: 16
        expiresAt:
          $ref: '#/components/schemas/Instant'
    MenuItemReference:
      type: string
      maxLength: 120
      minLength: 1
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    MenuDish:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - category
        - price
        - description
        - image
        - available
        - published
      properties:
        id:
          $ref: '#/components/schemas/MenuItemReference'
        name:
          type: string
          maxLength: 160
          minLength: 1
        category:
          type: string
          maxLength: 100
          minLength: 1
        price:
          $ref: '#/components/schemas/MoneyVnd'
        description:
          type: string
          maxLength: 4000
        image:
          anyOf:
            - type: string
              maxLength: 2048
            - type: 'null'
        available:
          type: boolean
        published:
          type: boolean
    Dish:
      allOf:
        - $ref: '#/components/schemas/MenuDish'
        - type: object
          properties:
            published:
              const: true
    MenuResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dish'
    OpsMenuItem:
      type: object
      additionalProperties: false
      required:
        - dish
        - version
      properties:
        dish:
          $ref: '#/components/schemas/MenuDish'
        version:
          $ref: '#/components/schemas/Version'
    OpsMenuResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpsMenuItem'
    MenuItemInput:
      type: object
      additionalProperties: false
      required:
        - name
        - category
        - price
        - description
        - available
        - published
      properties:
        name:
          type: string
          maxLength: 90
          pattern: '\S'
        category:
          type: string
          maxLength: 60
          pattern: '\S'
        price:
          type: integer
          minimum: 1
          maximum: 100000000
        description:
          type: string
          maxLength: 300
        available:
          type: boolean
        published:
          type: boolean
    CreateMenuItemInput:
      allOf:
        - $ref: '#/components/schemas/MenuItemInput'
        - type: object
          properties:
            description:
              pattern: '\S'
    UpdateMenuItemInput:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - item
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        item:
          $ref: '#/components/schemas/MenuItemInput'
    Slot:
      type: object
      additionalProperties: false
      required:
        - time
        - startsAt
        - available
        - reason
      properties:
        time:
          $ref: '#/components/schemas/Time'
        startsAt:
          $ref: '#/components/schemas/Instant'
        available:
          type: boolean
        reason:
          anyOf:
            - type: string
              enum:
                - CAPACITY_UNAVAILABLE
                - SLOT_CLOSED
                - BOOKING_WINDOW_CLOSED
            - type: 'null'
    AvailabilityResponse:
      type: object
      additionalProperties: false
      required:
        - date
        - timeZone
        - guests
        - slots
      properties:
        date:
          $ref: '#/components/schemas/Date'
        timeZone:
          type: string
          maxLength: 80
          minLength: 1
        guests:
          type: integer
          minimum: 1
          maximum: 2147483647
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
    ContactInput:
      type: object
      additionalProperties: false
      required:
        - name
        - phone
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 2
        phone:
          type: string
          maxLength: 24
          minLength: 7
          pattern: "^\\+?[0-9 ().-]+$"
          description: 'Cho nhập số theo giao diện hiện tại hoặc dạng quốc tế. Server chuẩn hóa và xác minh theo Q-07.'
    ContactView:
      type: object
      additionalProperties: false
      required:
        - name
        - phone
        - note
      properties:
        name:
          type: string
          maxLength: 80
        phone:
          type: string
          maxLength: 24
        note:
          anyOf:
            - type: string
              maxLength: 200
            - type: 'null'
    NewReservation:
      type: object
      additionalProperties: false
      required:
        - date
        - time
        - guests
        - contact
      properties:
        date:
          $ref: '#/components/schemas/Date'
        time:
          $ref: '#/components/schemas/Time'
        guests:
          type: integer
          minimum: 1
          maximum: 2147483647
        contact:
          $ref: '#/components/schemas/ContactInput'
        note:
          type: string
          maxLength: 200
        chatContext:
          type: string
          maxLength: 4096
          minLength: 1
          description: 'Ngữ cảnh có chữ ký do server cấp, gắn với phiên và khung giờ. Yêu cầu đặt gốc web có thể bỏ qua.'
    PreorderLineInput:
      type: object
      additionalProperties: false
      required:
        - dishId
        - quantity
      properties:
        dishId:
          type: string
          maxLength: 120
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
    PreorderLine:
      type: object
      additionalProperties: false
      required:
        - dishId
        - name
        - quantity
        - unitPrice
      properties:
        dishId:
          type: string
          maxLength: 120
          minLength: 1
        name:
          type: string
          maxLength: 160
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
        unitPrice:
          $ref: '#/components/schemas/MoneyVnd'
    PreorderInput:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - items
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreorderLineInput'
    AssignedTable:
      type: object
      additionalProperties: false
      required:
        - code
        - area
        - state
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 1
        area:
          type: string
          maxLength: 100
          minLength: 1
        state:
          type: string
          enum:
            - held
            - committed
    ReservationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - date
        - time
        - startsAt
        - endsAt
        - guests
        - source
        - status
