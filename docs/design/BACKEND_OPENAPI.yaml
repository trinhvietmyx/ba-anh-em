openapi: '3.1.1'
info:
  title: 'Nhà hàng Ba Anh Em API'
  version: '0.3.1-draft'
  description: 'Bản thiết kế Giai đoạn 3 gồm 15 thao tác tiếp nối outline, 9 thao tác kết nối, 3 thao tác quản lý thực đơn trong MVP và 1 thao tác có điều kiện. Các x-policy-questions trỏ tới BRS. Màn hình và route Frontend hiện có là chuẩn tích hợp.'
servers:
  - url: '/api/v1'
    description: 'Cùng origin với web.'
paths:
  '/guest/session':
    post:
      operationId: establishGuestSession
      tags:
        - 'Phiên khách'
      summary: 'Thiết lập hoặc phục hồi phiên khách'
      description: 'Gọi trước lệnh ghi đặt chỗ đầu tiên. Giữ phiên đang hợp lệ khi tải lại. Bắt buộc Origin thuộc danh sách origin của ứng dụng. Không trả danh sách lượt hoặc dữ liệu liên hệ.'
      x-design-status: proposed-integration
      x-policy-questions:
        - Q-07
        - Q-15
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: 'Phiên khách đã sẵn sàng. Cookie được đặt nếu tạo mới.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Cookie phiên hoặc cookie giao dịch đăng nhập. Các thuộc tính phụ thuộc HTTPS môi trường.'
              schema:
                type: string
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GuestSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/guest/reservation-attempts':
    get:
      operationId: getReservationAttempt
      tags:
        - 'Đặt chỗ'
      summary: 'Đọc kết quả lần tạo lượt khi chưa nhận mã'
      description: 'Dùng khóa lần gửi ban đầu và đúng phiên khách. Chỉ đọc kết quả đã commit cho createReservation mà phiên còn quyền xem. Nếu chưa có kết quả trong phạm vi phiên, trả 404. Phản hồi này cũng có thể xuất hiện khi lệnh đang xử lý. Giữ cùng khóa khi thử lại và không tạo lượt trong thao tác đọc.'
      x-design-status: proposed-integration
      x-policy-questions:
        - Q-07
        - Q-15
      security:
        - GuestCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 'Kết quả hiện hành của lượt đã tạo trong phạm vi phiên khách.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestReservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/AttemptUnavailable'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/ops/auth/login':
    get:
      operationId: beginStaffLogin
      tags:
        - 'Phiên vận hành'
      summary: 'Bắt đầu đăng nhập nhân sự'
      description: 'Điều hướng trình duyệt qua OIDC Authorization Code với PKCE. Server chỉ nhận đường dẫn vận hành cùng origin trong danh sách cho phép và kiểm quyền khi trở về.'
      x-design-status: proposed-integration
      x-policy-questions:
        - Q-08
      security: []
      parameters:
        - name: returnTo
          in: query
          description: 'Đường dẫn tương đối thuộc khu vực vận hành.'
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        '302':
          description: 'Chuyển sang IdP.'
          headers:
            Location:
              description: 'Địa chỉ HTTPS của IdP hoặc đường dẫn vận hành hợp lệ cùng origin.'
              schema:
                type: string
                format: uri-reference
            Set-Cookie:
              description: 'Cookie phiên hoặc cookie giao dịch đăng nhập. Các thuộc tính phụ thuộc HTTPS môi trường.'
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/ops/auth/callback':
    get:
      operationId: finishStaffLogin
      tags:
        - 'Phiên vận hành'
      summary: 'Hoàn thành đăng nhập nhân sự'
      description: 'IdP trả code và state hoặc kết quả từ chối đăng nhập. Backend xác thực giao dịch, ánh xạ tài khoản và chỉ cấp phiên cho nhân sự hợp lệ.'
      x-design-status: proposed-integration
      x-policy-questions:
        - Q-08
      security: []
      parameters:
        - name: code
          in: query
          description: 'Authorization code từ IdP.'
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: state
          in: query
          description: 'Mã chống giả mạo và gắn giao dịch OIDC.'
          required: false
          schema:
            type: string
            maxLength: 512
        - name: error
          in: query
          description: 'Mã kết quả từ chối do IdP trả.'
          required: false
          schema:
            type: string
            maxLength: 160
      responses:
        '303':
          description: 'Đã đăng nhập và chuyển về đường dẫn an toàn.'
          headers:
            Location:
              description: 'Địa chỉ HTTPS của IdP hoặc đường dẫn vận hành hợp lệ cùng origin.'
              schema:
                type: string
                format: uri-reference
            Set-Cookie:
              description: 'Cookie phiên hoặc cookie giao dịch đăng nhập. Các thuộc tính phụ thuộc HTTPS môi trường.'
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/ops/session':
    get:
      operationId: getStaffSession
      tags:
        - 'Phiên vận hành'
      summary: 'Đọc phiên nhân sự hiện tại'
      description: 'Trả quyền từ server và nhãn vai trò tương thích OpsLayout. Nhãn hiển thị không cấp quyền tác nghiệp.'
      x-design-status: proposed-integration
      x-policy-questions:
        - Q-08
      security:
        - StaffCookie: []
      responses:
        '200':
          description: 'Phiên và quyền được cấp.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/StaffSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: endStaffSession
      tags:
        - 'Phiên vận hành'
      summary: 'Đăng xuất khỏi khu vực vận hành'
      description: 'Thu hồi phiên tại ứng dụng và hết hạn cookie. Frontend bỏ cache vận hành cũ sau khi xác nhận hoặc nhận phiên đã hết.'
      x-design-status: proposed-integration
      x-policy-questions:
        - Q-08
      security:
        - StaffCookie: []
          CsrfToken: []
      responses:
        '204':
          description: 'Đã đăng xuất và xóa cookie phiên.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Cookie phiên hoặc cookie giao dịch đăng nhập. Các thuộc tính phụ thuộc HTTPS môi trường.'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/menu':
    get:
      operationId: listPublishedMenu
      tags:
        - 'Thực đơn'
      summary: 'Đọc thực đơn đã công bố'
      description: 'Danh sách hữu hạn của nhà hàng, theo thứ tự hiển thị rồi mã món. Trả trạng thái khả dụng riêng với trạng thái công bố. Frontend tiếp tục lọc và tìm trong danh sách đã tải.'
      x-policy-questions:
        - Q-09
      security: []
      responses:
        '200':
          description: 'Thực đơn công bố. items rỗng khi chưa có món.'
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/MenuResponse'
              example:
                items:
                  - id: ga-nuong-la-chanh
                    name: 'Gà nướng lá chanh'
                    category: 'Món nướng'
                    price: 329000
                    description: ''
                    image: '/images/menu/ga.webp'
                    available: true
                    published: true
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/availability':
    get:
      operationId: getAvailability
      tags:
        - 'Đặt chỗ'
      summary: 'Kiểm tra khả dụng của ngày và số khách'
      description: 'Trả các khung server đã kiểm cho ngày. Tham số time ưu tiên đánh giá khung được chọn và vẫn trả các khung thay thế có căn cứ. Kết quả phản ánh tại thời điểm đọc và được kiểm lại khi ghi.'
      x-policy-questions:
        - Q-01
        - Q-02
        - Q-03
      security: []
      parameters:
        - name: date
          in: query
          description: 'Ngày địa phương của nhà hàng.'
          required: true
          schema:
            $ref: '#/components/schemas/Date'
        - name: guests
          in: query
          description: 'Số khách. Giới hạn nhận đặt phụ thuộc Q-01.'
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: time
          in: query
          description: 'Giờ địa phương của nhà hàng. Bỏ qua để đọc cả ngày nếu thao tác cho phép.'
          required: false
          schema:
            $ref: '#/components/schemas/Time'
      responses:
        '200':
          description: 'Khung còn chỗ hoặc lý do không khả dụng.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/reservations':
    post:
      operationId: createReservation
      tags:
        - 'Đặt chỗ'
      summary: 'Ghi nhận ý định đặt bàn đã xác nhận'
      description: 'Cấp quyền lượt trong cùng transaction với lượt và khóa thao tác. Server xác định nguồn web hoặc chat từ chatContext hợp lệ, kiểm lại khả dụng và dùng chính sách được duyệt. Gửi lại cùng khóa sau mất phản hồi trả cùng mã trong quyền hiện tại.'
      x-policy-questions:
        - Q-01
        - Q-02
        - Q-03
        - Q-07
        - Q-11
        - Q-15
      security:
        - GuestCookie: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/NewReservation'
            example:
              date: '2026-12-05'
              time: '18:00'
              guests: 4
              contact:
                name: 'Khách mẫu'
                phone: '0900000001'
      responses:
        '201':
          description: 'Đã ghi nhận lượt hoặc phát lại kết quả của cùng lần tạo.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GuestReservation'
              example:
                id: BAE-1044
                date: '2026-12-05'
                time: '18:00'
                startsAt: '2026-12-05T11:00:00Z'
                endsAt: '2026-12-05T12:30:00Z'
                guests: 4
                source: web
                status: pending
                statusReason: null
                version: 1
                tables: []
                items: []
                preorderTotal: 0
                deposit: null
                nextActions:
                  - edit_preorder
                  - request_deposit
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/reservations/{id}':
    get:
      operationId: getGuestReservation
      tags:
        - 'Đặt chỗ'
      summary: 'Đọc lượt thuộc phiên khách'
      description: 'Phục hồi trang kết quả, chọn món và cọc theo mã lượt trong phạm vi phiên đã có quyền. Dùng mã lượt từ ngữ cảnh hiện có, không tìm theo điện thoại. Thiếu quyền trên lượt trả 404 theo chính sách che tồn tại.'
      x-design-status: proposed-integration
      x-policy-questions:
        - Q-07
        - Q-15
      security:
        - GuestCookie: []
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: 'Kết quả có thể hiển thị cho khách.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GuestReservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/reservations/{id}/preorders':
    put:
      operationId: replacePreorder
      tags:
        - 'Đặt món'
      summary: 'Ghi danh sách món đặt trước'
      description: 'Kiểm phiên bản, quyền và hạn chọn. So với dòng đã lưu trước khi kiểm khả dụng. Theo phương án chờ Q-05/Q-09, thêm hoặc tăng chỉ áp dụng cho món đang công bố và nhận đặt, còn giữ nguyên hoặc giảm dòng đã lưu có thể giữ snapshot dù món đã ẩn hoặc hết. Server xác định giá. Mảng rỗng yêu cầu xóa theo chính sách. rejectedItems chỉ có dữ liệu nếu duyệt xử lý một phần.'
      x-policy-questions:
        - Q-05
        - Q-07
        - Q-09
      security:
        - GuestCookie: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/PreorderInput'
            example:
              expectedVersion: 1
              items:
                - dishId: ga-nuong-la-chanh
                  quantity: 2
      responses:
        '200':
          description: 'Danh sách món và phiên bản lượt có hiệu lực.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/PreorderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/reservations/{id}/deposits':
    post:
      operationId: createOrGetDeposit
      tags:
        - 'Đặt cọc'
      summary: 'Cấp hoặc đọc lại khoản cọc đang hiệu lực'
      description: 'Lượt, số tiền và người nhận được xác định bởi server. Body rỗng. Cấp mới khi đủ điều kiện, nếu khoản hiện hành có thể dùng thì trả lại. Chuẩn bị VietQR theo tham chiếu đã lưu.'
      x-policy-questions:
        - Q-03
        - Q-04
        - Q-07
        - Q-15
      security:
        - GuestCookie: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 'Khoản hiện hành có thể dùng.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/DepositView'
        '201':
          description: 'Đã ghi khoản cọc mới.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/DepositView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/reservations/{id}/deposits/{depositId}':
    get:
      operationId: getGuestDeposit
      tags:
        - 'Đặt cọc'
      summary: 'Đọc VietQR và trạng thái cọc'
      description: 'Kiểm cả quyền với lượt và quan hệ khoản cọc thuộc lượt. QR và thông tin chuyển chỉ trả khi còn được thanh toán. Lệnh đọc không xác nhận chuyển tiền.'
      x-policy-questions:
        - Q-03
        - Q-04
        - Q-07
      security:
        - GuestCookie: []
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/DepositId'
      responses:
        '200':
          description: 'Thông tin và trạng thái cọc trong phạm vi khách.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/DepositView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  '/reservations/{id}/deposits/{depositId}/notices':
    post:
      operationId: reportDepositTransfer
      tags:
        - 'Đặt cọc'
      summary: 'Thông báo đã chuyển khoản'
      description: 'Ánh xạ nút Báo đã chuyển hiện có nếu Q-04 duyệt dùng. Body rỗng. Chỉ ghi thông báo của khách, không xác minh tiền hoặc xác nhận bàn. Gửi lặp chỉ trả lại kết quả hợp lệ của cùng thông báo.'
      x-design-status: conditional
