name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Check and build workspaces
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Scan for committed secrets
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --volume "${PWD}:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact /repo
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Validate PostgreSQL Compose configuration
        run: docker compose --env-file .env.example -f infra/compose/compose.dev.yaml config --quiet
