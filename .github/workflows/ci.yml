name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Check and build workspaces
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Scan for committed secrets
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --volume "${PWD}:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact /repo
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run contract:check
      - run: npm audit --audit-level=high
      - run: npm exec -- playwright install --with-deps --only-shell chromium
      - name: Run foundation and session integration tests with PostgreSQL 17
        shell: bash
        env:
          POSTGRES_PORT: '55432'
        run: |
          compose=(docker compose --project-name ba-anh-em-ci --env-file .env.example -f infra/compose/compose.dev.yaml)
          export POSTGRES_PASSWORD="$(node -p "require('node:crypto').randomBytes(24).toString('hex')")"
          "${compose[@]}" config --quiet
          trap '"${compose[@]}" down' EXIT
          "${compose[@]}" up -d --wait --wait-timeout 60
          ci_migration_url="postgresql://ba_anh_em:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/ba_anh_em"
          MIGRATION_DATABASE_URL="$ci_migration_url" npm run db:migrate -w @ba-anh-em/api
          psql=("${compose[@]}" exec -T postgres psql -X -U ba_anh_em -d ba_anh_em -v ON_ERROR_STOP=1)
          ci_readiness_password="$(node -p "require('node:crypto').randomBytes(24).toString('hex')")"
          "${psql[@]}" -q -v readiness_password="$ci_readiness_password" <<'SQL'
          CREATE ROLE bae_readiness_ci LOGIN PASSWORD :'readiness_password';
          GRANT USAGE ON SCHEMA ba_anh_em TO bae_readiness_ci;
          GRANT SELECT ON ba_anh_em.venues, ba_anh_em.kysely_migration TO bae_readiness_ci;
          GRANT SELECT, INSERT ON ba_anh_em.guest_sessions TO bae_readiness_ci;
          SQL
          export BAE_TEST_DATABASE_URL="postgresql://bae_readiness_ci:${ci_readiness_password}@127.0.0.1:${POSTGRES_PORT}/ba_anh_em"
          BAE_TEST_POSTGRES_ADMIN_URL="$ci_migration_url" npm run test:integration
          BAE_E2E_GUEST_SESSION=1 npm run test:e2e
